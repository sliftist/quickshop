<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Price Bar Colors</title>
<style>
    body { font-family: Inter, Arial, sans-serif; margin: 20px; background: #fff; color: #1a1a1a; }
    h2 { font-size: 16px; margin: 24px 0 8px; }
    .presets { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 16px; }
    .preset { border: 1px solid #ddd; padding: 10px; cursor: pointer; }
    .preset:hover { border-color: #888; }
    .preset.active { border: 2px solid #178c81; padding: 9px; }
    .presetName { font-weight: bold; margin-bottom: 6px; }
    .rows { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
    .row { position: relative; height: 24px; display: flex; align-items: center; gap: 6px; padding: 0 6px; font-size: 15px; font-weight: bold; overflow: hidden; }
    .row .fill { position: absolute; left: 0; top: 0; height: 100%; }
    .row span { position: relative; }
    .row .was { font-weight: normal; text-decoration: line-through; opacity: 0.8; font-size: 13px; }
    .row .cost { position: relative; margin-left: auto; font-weight: normal; font-size: 11px; opacity: 0.85; }
    .editor { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
    .group { border: 1px solid #ddd; padding: 10px; }
    .group label { display: grid; grid-template-columns: 30px 1fr 40px; align-items: center; gap: 6px; font-size: 13px; }
    .swatch { height: 18px; margin-bottom: 6px; }
    textarea { width: 100%; height: 160px; font-family: monospace; font-size: 12px; }
    .preview { max-width: 700px; }
</style>
</head>
<body>
<h2>Presets (click one to edit it below)</h2>
<div class="presets" id="presets"></div>

<h2>Editor</h2>
<div class="preview"><div class="rows" id="previewRows"></div></div>
<div class="editor" id="editor"></div>

<h2>Values (send these back)</h2>
<textarea id="output" readonly></textarea>

<script>
const SAMPLE_COSTS = [0.2, 0.55, 0.9, 1.6, 2.6, 4.2, 6, 9, 14, 24];
const STAGE_MAXES = [1, 5, 20];
const FIELDS = ["stage1", "stage2", "stage3", "track", "text", "saleText"];
const FIELD_LABELS = { stage1: "Stage 1 (up to $1)", stage2: "Stage 2 (up to $5)", stage3: "Stage 3 (up to $20)", track: "Track (empty part)", text: "Price text", saleText: "Sale price text" };

const PRESETS = [
    { name: "Current", stage1: [135, 60, 30], stage2: [212, 75, 38], stage3: [28, 90, 40], track: [0, 0, 42], text: [0, 0, 100], saleText: [0, 100, 82] },
    { name: "Muted earthy", stage1: [145, 30, 36], stage2: [205, 35, 40], stage3: [24, 50, 44], track: [30, 6, 38], text: [40, 30, 97], saleText: [8, 80, 84] },
    { name: "Vivid", stage1: [140, 75, 36], stage2: [216, 85, 46], stage3: [24, 95, 48], track: [0, 0, 28], text: [0, 0, 100], saleText: [0, 100, 85] },
    { name: "Deep jewel", stage1: [160, 70, 24], stage2: [230, 60, 34], stage3: [345, 65, 38], track: [240, 10, 22], text: [0, 0, 100], saleText: [350, 100, 86] },
    { name: "Teal ramp", stage1: [174, 45, 42], stage2: [174, 72, 28], stage3: [190, 90, 16], track: [174, 8, 60], text: [0, 0, 100], saleText: [0, 100, 85] },
    { name: "Traffic light", stage1: [120, 55, 32], stage2: [48, 85, 38], stage3: [4, 75, 42], track: [0, 0, 35], text: [0, 0, 100], saleText: [55, 100, 80] },
    { name: "Slate + accents", stage1: [150, 40, 40], stage2: [205, 55, 45], stage3: [20, 75, 50], track: [215, 18, 30], text: [0, 0, 100], saleText: [10, 100, 82] },
    { name: "Pastel, dark text", stage1: [140, 50, 78], stage2: [210, 65, 80], stage3: [30, 85, 76], track: [0, 0, 90], text: [0, 0, 12], saleText: [0, 75, 40] },
];

let current = structuredClone(PRESETS[0]);

function hsl([h, s, l]) {
    return `hsl(${h}, ${s}%, ${l}%)`;
}

function stageFractions(cost) {
    let previousMax = 0;
    return STAGE_MAXES.map(max => {
        let fraction = Math.min(1, Math.max(0, (cost - previousMax) / (max - previousMax)));
        previousMax = max;
        return fraction;
    });
}

function renderRows(container, palette) {
    container.innerHTML = "";
    SAMPLE_COSTS.forEach((cost, index) => {
        let onSale = index % 2 === 1;
        let price = (cost * 3.1 + 0.99).toFixed(2);
        let row = document.createElement("div");
        row.className = "row";
        row.style.background = hsl(palette.track);
        stageFractions(cost).forEach((fraction, stageIndex) => {
            if (!fraction) return;
            let fill = document.createElement("div");
            fill.className = "fill";
            fill.style.width = `${Math.round(fraction * 100)}%`;
            fill.style.background = hsl(palette[`stage${stageIndex + 1}`]);
            row.appendChild(fill);
        });
        let priceSpan = document.createElement("span");
        priceSpan.textContent = `$${price}`;
        priceSpan.style.color = hsl(onSale ? palette.saleText : palette.text);
        row.appendChild(priceSpan);
        if (onSale) {
            let was = document.createElement("span");
            was.className = "was";
            was.textContent = `$${(price * 1.3).toFixed(2)}`;
            was.style.color = hsl(palette.text);
            row.appendChild(was);
        }
        let costSpan = document.createElement("span");
        costSpan.className = "cost";
        costSpan.textContent = `$${cost.toFixed(2)}/100g`;
        costSpan.style.color = hsl(palette.text);
        row.appendChild(costSpan);
        container.appendChild(row);
    });
}

function renderPresets() {
    let container = document.getElementById("presets");
    container.innerHTML = "";
    PRESETS.forEach(preset => {
        let box = document.createElement("div");
        box.className = "preset" + (preset.name === current.name ? " active" : "");
        let name = document.createElement("div");
        name.className = "presetName";
        name.textContent = preset.name;
        let rows = document.createElement("div");
        rows.className = "rows";
        renderRows(rows, preset);
        box.append(name, rows);
        box.onclick = () => {
            current = structuredClone(preset);
            renderAll();
        };
        container.appendChild(box);
    });
}

function renderEditor() {
    let container = document.getElementById("editor");
    container.innerHTML = "";
    FIELDS.forEach(field => {
        let group = document.createElement("div");
        group.className = "group";
        let title = document.createElement("div");
        title.textContent = FIELD_LABELS[field];
        title.style.fontWeight = "bold";
        title.style.marginBottom = "6px";
        let swatch = document.createElement("div");
        swatch.className = "swatch";
        swatch.style.background = hsl(current[field]);
        group.append(title, swatch);
        [["H", 360], ["S", 100], ["L", 100]].forEach(([letter, max], channel) => {
            let label = document.createElement("label");
            let name = document.createElement("span");
            name.textContent = letter;
            let slider = document.createElement("input");
            slider.type = "range";
            slider.min = "0";
            slider.max = String(max);
            slider.value = String(current[field][channel]);
            let value = document.createElement("span");
            value.textContent = slider.value;
            slider.oninput = () => {
                current[field][channel] = Number(slider.value);
                current.name = "Custom";
                value.textContent = slider.value;
                swatch.style.background = hsl(current[field]);
                renderPreviewAndOutput();
            };
            label.append(name, slider, value);
            group.appendChild(label);
        });
        container.appendChild(group);
    });
}

function renderPreviewAndOutput() {
    renderRows(document.getElementById("previewRows"), current);
    let output = {};
    FIELDS.forEach(field => {
        let [h, s, l] = current[field];
        output[field] = { h, s, l };
    });
    document.getElementById("output").value = JSON.stringify(output, undefined, 4);
}

function renderAll() {
    renderPresets();
    renderEditor();
    renderPreviewAndOutput();
}

renderAll();
</script>
</body>
</html>
